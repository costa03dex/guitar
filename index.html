<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Lente · Câmera com filtros</title>
<style>
  :root {
    --glass: rgba(255,255,255,.14);
    --glass-border: rgba(255,255,255,.28);
    --text: #fff;
    --accent: #ffe600;
    --item: 64px;          /* tamanho de cada filtro no carrossel */
    --item-active: 84px;   /* tamanho do filtro central (botão de captura) */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: #000; color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

  /* ---------- Preview em tela cheia ---------- */
  #stage { position: fixed; inset: 0; background: #0a0a0f; }
  #video { width: 100%; height: 100%; object-fit: cover; display: block;
    transition: filter .25s ease; }
  /* Espelha a câmera frontal (efeito de espelho). Só o preview/captura da frontal usam isso. */
  #video.mirror { transform: scaleX(-1); }
  /* Camada de cor usada pelo filtro Neon (mix-blend-mode simula o "overlay" do canvas) */
  #tint { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s; }

  /* ---------- Elementos de vidro (glassmorphism) ---------- */
  .glass { background: var(--glass); border: 1px solid var(--glass-border);
    -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); }

  #topbar { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
    align-items: center; padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 0; z-index: 5; }
  .brand { padding: 8px 14px; border-radius: 999px; font-weight: 700; letter-spacing: .02em; font-size: 15px; }
  .icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    color: #fff; cursor: pointer; padding: 0; }
  .icon-btn svg { width: 22px; height: 22px; }

  /* ---------- Rodapé: nome do filtro + carrossel ---------- */
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    background: linear-gradient(to top, rgba(0,0,0,.55), transparent); padding-top: 40px; }
  #filterName { text-align: center; font-size: 14px; font-weight: 600; height: 34px;
    margin: 0 auto 8px; width: fit-content; padding: 7px 16px; border-radius: 999px; }

  /* Carrossel: scroll horizontal com "snap" para centralizar o item mais próximo */
  #carousel { display: flex; align-items: center; gap: 18px; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scrollbar-width: none; height: calc(var(--item-active) + 16px);
    padding: 0 calc(50% - var(--item-active) / 2); }
  #carousel::-webkit-scrollbar { display: none; }
  .lens { flex: 0 0 auto; width: var(--item); height: var(--item); border-radius: 50%;
    scroll-snap-align: center; border: 3px solid rgba(255,255,255,.75); cursor: pointer; padding: 0;
    transition: width .2s, height .2s, border-color .2s, opacity .2s; opacity: .8; }
  .lens.active { width: var(--item-active); height: var(--item-active); border: 5px solid #fff;
    opacity: 1; box-shadow: 0 0 0 3px rgba(0,0,0,.25), 0 6px 24px rgba(0,0,0,.45); }
  .lens.active:active { transform: scale(.93); }
  .lens:focus-visible, .icon-btn:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  /* ---------- Flash de captura ---------- */
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 8; }
  #flash.go { animation: flash .35s ease-out; }
  @keyframes flash { 0% { opacity: .9 } 100% { opacity: 0 } }

  /* ---------- Modal da foto ---------- */
  #modal { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.6); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); padding: 20px; }
  #modal.open { display: flex; }
  .sheet { width: min(420px, 100%); border-radius: 26px; padding: 14px; display: flex; flex-direction: column; gap: 14px;
    animation: pop .22s ease-out; }
  @keyframes pop { from { transform: scale(.94); opacity: 0 } to { transform: none; opacity: 1 } }
  #photo { width: 100%; max-height: 62vh; object-fit: contain; border-radius: 16px; background: #000; display: block; }
  .row { display: flex; gap: 10px; }
  .btn { flex: 1; border: 0; border-radius: 14px; padding: 14px; font: inherit; font-weight: 700; cursor: pointer; }
  .btn.primary { background: var(--accent); color: #111; }
  .btn.ghost { background: rgba(255,255,255,.16); color: #fff; }

  /* ---------- Tela de erro / permissão ---------- */
  #gate { position: fixed; inset: 0; z-index: 9; display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; padding: 32px; text-align: center; background: #0a0a0f; }
  #gate.show { display: flex; }
  #gate p { max-width: 32ch; margin: 0; line-height: 1.5; opacity: .85; }
  #gate .btn { flex: none; padding: 14px 28px; }

  @media (min-width: 900px) {
    /* No desktop o preview continua em tela cheia; só aumentamos o carrossel levemente */
    :root { --item: 72px; --item-active: 96px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <div id="tint"></div>
</div>

<header id="topbar">
  <div class="brand glass">Lente</div>
  <button class="icon-btn glass" id="flipBtn" aria-label="Alternar câmera">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7h4l2-3h6l2 3h4v12H3z"/><path d="M9 13a3 3 0 0 1 5-2l1 1M15 14a3 3 0 0 1-5 2l-1-1"/></svg>
  </button>
</header>

<footer id="bottom">
  <div id="filterName" class="glass" aria-live="polite">Normal</div>
  <div id="carousel" role="listbox" aria-label="Filtros"></div>
</footer>

<div id="flash"></div>

<div id="modal" role="dialog" aria-modal="true" aria-label="Foto capturada">
  <div class="sheet glass">
    <img id="photo" alt="Foto capturada com o filtro aplicado">
    <div class="row">
      <button class="btn ghost" id="closeBtn">Descartar</button>
      <button class="btn primary" id="downloadBtn">Baixar foto</button>
    </div>
  </div>
</div>

<div id="gate">
  <h2 id="gateTitle" style="margin:0">Ative sua câmera</h2>
  <p id="gateMsg">Precisamos de acesso à câmera para mostrar o preview com filtros.</p>
  <button class="btn primary" id="retryBtn">Permitir câmera</button>
</div>

<script>
/* =====================================================================
   1) DEFINIÇÃO DOS FILTROS
   Cada filtro é uma string de CSS filter. A MESMA string é usada:
   - no preview (video.style.filter), e
   - na captura (ctx.filter do canvas), garantindo que a foto = o que se vê.
   "tint" é uma camada de gradiente opcional misturada sobre a imagem.
   ===================================================================== */
const FILTERS = [
  { name: 'Normal',          css: 'none',
    swatch: 'linear-gradient(135deg,#fff,#9aa0a6)' },
  { name: 'Preto e Branco',  css: 'grayscale(1) contrast(1.15)',
    swatch: 'linear-gradient(135deg,#f2f2f2,#222)' },
  { name: 'Cyberpunk',       css: 'hue-rotate(-20deg) saturate(1.9) contrast(1.2) brightness(1.05)',
    tint: { from: '#ff2bd6', to: '#00e5ff', mode: 'overlay', alpha: .55 },
    swatch: 'linear-gradient(135deg,#ff2bd6,#00e5ff)' },
  { name: 'Vintage',         css: 'sepia(.85) contrast(1.05) brightness(1.05) saturate(1.1)',
    swatch: 'linear-gradient(135deg,#f3d9a4,#8a5a2b)' },
  { name: 'Beleza',          css: 'blur(1px) brightness(1.12) saturate(1.3) contrast(.94)',
    swatch: 'linear-gradient(135deg,#ffe3ec,#ffb3c7)' },
  { name: 'Divertido',       css: 'saturate(3) contrast(1.25) hue-rotate(-25deg)',
    swatch: 'linear-gradient(135deg,#7cff00,#ff00b8 55%,#00c8ff)' },
];

/* =====================================================================
   2) REFERÊNCIAS E ESTADO
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const video = $('video'), tint = $('tint'), carousel = $('carousel');
const state = { index: 0, facing: 'user', stream: null, blob: null, url: null };

/* =====================================================================
   3) CÂMERA (WebRTC / getUserMedia)
   ===================================================================== */
async function startCamera() {
  stopCamera();
  try {
    // facingMode: 'user' = frontal, 'environment' = traseira
    state.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: state.facing, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    video.srcObject = state.stream;
    // Espelha somente a câmera frontal, como um espelho natural
    video.classList.toggle('mirror', state.facing === 'user');
    $('gate').classList.remove('show');
  } catch (err) {
    showGate(err);
  }
}
function stopCamera() {
  if (state.stream) state.stream.getTracks().forEach(t => t.stop());
  state.stream = null;
}
function showGate(err) {
  const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
  $('gateTitle').textContent = denied ? 'Câmera bloqueada' : 'Câmera indisponível';
  $('gateMsg').textContent = !navigator.mediaDevices
    ? 'Abra esta página via HTTPS ou localhost para usar a câmera.'
    : denied ? 'Libere a câmera nas permissões do navegador e toque em tentar de novo.'
             : 'Não encontramos uma câmera disponível. Conecte uma e tente de novo.';
  $('retryBtn').textContent = 'Tentar de novo';
  $('gate').classList.add('show');
}

/* =====================================================================
   4) CARROSSEL DE FILTROS
   O item centralizado é o ativo e funciona como botão de captura.
   Tocar num item lateral apenas o centraliza (e seleciona).
   ===================================================================== */
FILTERS.forEach((f, i) => {
  const b = document.createElement('button');
  b.className = 'lens'; b.style.background = f.swatch;
  b.setAttribute('role', 'option'); b.setAttribute('aria-label', f.name);
  b.addEventListener('click', () => {
    if (i === state.index) capture();           // já está no centro → tira a foto
    else b.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  });
  carousel.appendChild(b);
});
const lenses = [...carousel.children];

function applyFilter(i) {
  state.index = i;
  const f = FILTERS[i];
  video.style.filter = f.css;                    // filtro em tempo real via CSS
  if (f.tint) {                                  // camada de cor (Neon)
    tint.style.background = `linear-gradient(135deg, ${f.tint.from}, ${f.tint.to})`;
    tint.style.mixBlendMode = f.tint.mode;
    tint.style.opacity = f.tint.alpha;
  } else tint.style.opacity = 0;
  lenses.forEach((el, k) => {
    el.classList.toggle('active', k === i);
    el.setAttribute('aria-selected', k === i);
  });
  $('filterName').textContent = f.name;
}

// Descobre qual item está mais perto do centro durante o scroll
let ticking = false;
carousel.addEventListener('scroll', () => {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    const mid = carousel.scrollLeft + carousel.clientWidth / 2;
    let best = 0, dist = Infinity;
    lenses.forEach((el, k) => {
      const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - mid);
      if (d < dist) { dist = d; best = k; }
    });
    if (best !== state.index) applyFilter(best);
  });
});
function goTo(i) {
  i = Math.max(0, Math.min(FILTERS.length - 1, i));
  lenses[i].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

/* =====================================================================
   5) CAPTURA: desenha o frame atual num <canvas> com o filtro aplicado
   ===================================================================== */
function capture() {
  if (!state.stream || !video.videoWidth) return;
  const f = FILTERS[state.index];

  // Recorta o frame com a mesma proporção da tela (object-fit: cover),
  // para a foto sair exatamente como aparece no preview.
  const vw = video.videoWidth, vh = video.videoHeight;
  const screenRatio = video.clientWidth / video.clientHeight;
  let sw = vw, sh = vh;
  if (vw / vh > screenRatio) sw = vh * screenRatio; else sh = vw / screenRatio;
  const sx = (vw - sw) / 2, sy = (vh - sh) / 2;

  const canvas = document.createElement('canvas');
  canvas.width = Math.round(sw); canvas.height = Math.round(sh);
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  // Suporte nativo a ctx.filter (Chrome/Firefox/Edge). Safari/iOS não tem → fallback por pixels.
  const nativeFilter = 'filter' in ctx;

  ctx.save();
  if (state.facing === 'user') {               // espelha a foto da frontal, igual ao preview
    ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
  }
  if (nativeFilter) ctx.filter = f.css;
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  ctx.restore();
  ctx.filter = 'none';

  if (!nativeFilter && f.css !== 'none') pixelFilter(ctx, canvas.width, canvas.height, f.css);

  // Camada de cor (gradiente + modo de mistura)
  if (f.tint) {
    const g = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    g.addColorStop(0, f.tint.from); g.addColorStop(1, f.tint.to);
    ctx.globalCompositeOperation = f.tint.mode;
    ctx.globalAlpha = f.tint.alpha;
    ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  }

  // Efeito de flash + congela a imagem no modal
  const flash = $('flash'); flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
  canvas.toBlob((blob) => {
    if (!blob) return;
    if (state.url) URL.revokeObjectURL(state.url);
    state.blob = blob; state.url = URL.createObjectURL(blob);
    $('photo').src = state.url;
    $('modal').classList.add('open');
    $('downloadBtn').focus();
  }, 'image/jpeg', 0.93);
}

/* Fallback para navegadores sem ctx.filter: aplica as funções do filtro pixel a pixel.
   Suporta grayscale, sepia, saturate, contrast, brightness e invert. (blur/hue-rotate ficam de fora.) */
function pixelFilter(ctx, w, h, css) {
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  const ops = [...css.matchAll(/(\w[\w-]*)\(([\d.]+)(?:px|deg)?\)/g)].map(m => [m[1], parseFloat(m[2])]);
  const clamp = (v) => v < 0 ? 0 : v > 255 ? 255 : v;
  for (let i = 0; i < d.length; i += 4) {
    let r = d[i], g = d[i + 1], b = d[i + 2];
    for (const [fn, a] of ops) {
      const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      if (fn === 'grayscale') { r += (lum - r) * a; g += (lum - g) * a; b += (lum - b) * a; }
      else if (fn === 'sepia') {
        const sr = .393 * r + .769 * g + .189 * b, sg = .349 * r + .686 * g + .168 * b, sb = .272 * r + .534 * g + .131 * b;
        r += (sr - r) * a; g += (sg - g) * a; b += (sb - b) * a;
      }
      else if (fn === 'saturate') { r = lum + (r - lum) * a; g = lum + (g - lum) * a; b = lum + (b - lum) * a; }
      else if (fn === 'contrast') { r = (r - 128) * a + 128; g = (g - 128) * a + 128; b = (b - 128) * a + 128; }
      else if (fn === 'brightness') { r *= a; g *= a; b *= a; }
      else if (fn === 'invert') { r += (255 - 2 * r) * a; g += (255 - 2 * g) * a; b += (255 - 2 * b) * a; }
      r = clamp(r); g = clamp(g); b = clamp(b);
    }
    d[i] = r; d[i + 1] = g; d[i + 2] = b;
  }
  ctx.putImageData(img, 0, 0);
}

/* =====================================================================
   6) DOWNLOAD E EVENTOS
   ===================================================================== */
$('downloadBtn').addEventListener('click', () => {
  if (!state.url) return;
  const a = document.createElement('a');
  a.href = state.url;
  a.download = `lente-${FILTERS[state.index].name.toLowerCase().replace(/\s+/g, '-')}-${Date.now()}.jpg`;
  document.body.appendChild(a); a.click(); a.remove();
});
const closeModal = () => $('modal').classList.remove('open');
$('closeBtn').addEventListener('click', closeModal);
$('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
$('flipBtn').addEventListener('click', () => {
  state.facing = state.facing === 'user' ? 'environment' : 'user';
  startCamera();
});
$('retryBtn').addEventListener('click', startCamera);

// Teclado: setas trocam de filtro, espaço/Enter captura, Esc fecha o modal
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
  if ($('modal').classList.contains('open')) return;
  if (e.key === 'ArrowRight') goTo(state.index + 1);
  if (e.key === 'ArrowLeft') goTo(state.index - 1);
  if (e.key === ' ' && document.activeElement === document.body) { e.preventDefault(); capture(); }
});

/* =====================================================================
   7) INICIALIZAÇÃO
   ===================================================================== */
applyFilter(0);
if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) showGate();
else startCamera();   // pede permissão da câmera ao abrir
</script>
</body>
</html>
